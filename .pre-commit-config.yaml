# Install once: pre-commit install
# Run on everything: pre-commit run --all-files
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks # scans staged changes for secrets (config: .gitleaks.toml)

  # TruffleHog (#125): 800+ detectors; verifies whether a found secret is live. Uses the local binary
  # (brew install trufflehog) instead of building it with Go. Scans staged changes; fails on verified or
  # unknown (could not verify) secrets. Mark a false positive with a `trufflehog:ignore` comment on its line.
  - repo: local
    hooks:
      - id: trufflehog
        name: TruffleHog
        entry: trufflehog git file://. --since-commit HEAD --results=verified,unknown --fail --no-update --trust-local-git-config
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--unsafe] # HA YAML uses custom tags like !include
      - id: check-json
        exclude: ^premium/(tsconfig\.json)$ # JSONC (comments) is not plain JSON
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key
