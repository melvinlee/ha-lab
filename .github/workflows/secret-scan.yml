# Secret scanning with TruffleHog (#125). Runs on every push to main and on pull requests.
# Fails on verified (live) or unknown (could not verify) secrets; plain pattern matches are left to the
# gitleaks pre-commit hook. The repo is public, so rotate anything this finds before cleaning history.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@v3.100.0
        with:
          extra_args: --results=verified,unknown
