# Secret scanning with TruffleHog (#125).
# - push to main: scans the pushed commits; pull_request: the PR's commits (base..head).
# - workflow_dispatch and the weekly schedule: the whole history. Run it by hand after a history rewrite
#   (force-push to main), where the push run can't resolve the old `before` commit and fails.
# Fails on verified (live) or unknown (could not verify) secrets. The repo is public: rotate anything
# this finds before cleaning history.
# Actions are pinned to commit SHAs (tag in the comment); the TruffleHog image is pinned with `version`.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC, full history

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@d232362a64a09a9e7d58267b8f5acef00ae90e23 # v3.100.0
        with:
          version: 3.100.0
          extra_args: --results=verified,unknown
