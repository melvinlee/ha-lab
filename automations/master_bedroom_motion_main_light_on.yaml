# Exported from HA via GET /api/config/automation/config/master_bedroom_motion_main_light_on
id: master_bedroom_motion_main_light_on
alias: 'Master Bedroom: motion turns on Main light'
description: When the Aqara Motion sensor P1 detects motion, turn on Main light (Bedroom
  Switch top rocker).
triggers:
- trigger: state
  entity_id: binary_sensor.aqara_motion_sensor_p1_occupancy
  from: 'off'
  to: 'on'
conditions:
- condition: state
  entity_id: switch.smart_wall_switch_z1_pro_top
  state: 'off'
actions:
- action: switch.turn_on
  target:
    entity_id: switch.smart_wall_switch_z1_pro_top
mode: single
