---
id: living_room_front_door_back_home
alias: 'Living Room: front door opens → Back Home'
description: 'Front door opens while the TV Spotlights are off (or their TV Light
  rocker is off): switch on the TV Light rocker and the Dining center rocker first
  (they power the spotlights), wait for the bulbs to boot, then scene Back Home (fan,
  TV + Dining Spotlights 3500K/50%).'
triggers:
- trigger: state
  entity_id: binary_sensor.front_door_sensor_contact
  from: 'off'
  to: 'on'
conditions:
- condition: or
  conditions:
  - condition: state
    entity_id: switch.living_room_switch_bottom
    state: 'off'
  - condition: state
    entity_id: light.tv_spotlights
    state: 'off'
actions:
- action: switch.turn_on
  target:
    entity_id:
    - switch.living_room_switch_bottom
    - switch.dining_switch_center
- delay:
    seconds: 3
- action: scene.turn_on
  target:
    entity_id: scene.back_home
mode: single
