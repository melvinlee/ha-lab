# Exported from HA via GET /api/config/automation/config/living_room_front_door_back_home
---
id: living_room_front_door_back_home
alias: 'Living Room: front door opens → Back Home'
description: Front door opens while the TV Spotlights are off (or their TV Light rocker
  is off). If the Dining center or TV Light rocker is off, both spotlight rockers
  go on first and it waits 3 s for the bulbs to boot; then it runs scene.back_home
  (Walkway, rockers, Dining + TV Spotlights 3500K/50%, Ceiling Fan). The scene is
  the single definition of Back Home (#82).
triggers:
- trigger: state
  entity_id: binary_sensor.front_door_sensor_contact
  from: 'off'
  to: 'on'
conditions:
- condition: or
  conditions:
  - condition: state
    entity_id: switch.living_room_switch_bottom
    state: 'off'
  - condition: state
    entity_id: light.tv_spotlights
    state: 'off'
actions:
- if:
  - condition: or
    conditions:
    - condition: state
      entity_id: switch.dining_switch_center
      state: 'off'
    - condition: state
      entity_id: switch.living_room_switch_bottom
      state: 'off'
  then:
  - action: switch.turn_on
    target:
      entity_id:
      - switch.dining_switch_center
      - switch.living_room_switch_bottom
  - delay:
      seconds: 3
- action: scene.turn_on
  target:
    entity_id: scene.back_home
mode: single
