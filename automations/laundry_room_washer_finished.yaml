---
id: laundry_room_washer_finished
alias: 'Laundry Room: Washer finished notification'
description: Notify iPhone and iPad when the washer cycle ends (#47)
triggers:
- trigger: state
  entity_id: sensor.laundry_room_washer_machine_state
  from: run
  to: stop
conditions: []
actions:
- action: notify.send_message
  target:
    entity_id:
    - notify.melvin_iphone_16_pro
    - notify.melvins_ipad_air
  data:
    title: Laundry Room
    message: Washer finished, ready to unload.
mode: single
