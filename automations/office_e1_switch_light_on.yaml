# Exported from HA via GET /api/config/automation/config/office_e1_switch_light_on
---
id: office_e1_switch_light_on
alias: 'Office: Mini Switch toggles main light and ring'
description: 'Office Mini Switch (Aqara E1, WXKG20LM): single press toggles the Office
  Light main light, double press toggles the ambient ring (#122).'
triggers:
- id: single
  trigger: mqtt
  topic: zigbee2mqtt/Office Mini Switch
  value_template: "{{ value_json.action }}"
  payload: single
- id: double
  trigger: mqtt
  topic: zigbee2mqtt/Office Mini Switch
  value_template: "{{ value_json.action }}"
  payload: double
conditions: []
actions:
- choose:
  - conditions:
    - condition: trigger
      id: single
    sequence:
    - action: light.toggle
      target:
        entity_id: light.aqara_ceiling_light_t1_white
  - conditions:
    - condition: trigger
      id: double
    sequence:
    - action: light.toggle
      target:
        entity_id: light.aqara_ceiling_light_t1_rgb
mode: queued
