# Exported from HA via GET /api/config/automation/config/master_bedroom_tradfri_button
id: master_bedroom_tradfri_button
alias: 'Master Bedroom: TRADFRI button toggles LED Cove'
description: 'IKEA TRADFRI shortcut button (E1812): a single press (action "on") toggles
  LED Cove (Z1 Pro center rocker).'
triggers:
- trigger: mqtt
  topic: zigbee2mqtt/TRADFRI
  value_template: "{{ value_json.action }}"
  payload: 'on'
conditions: []
actions:
- action: switch.toggle
  target:
    entity_id: switch.smart_wall_switch_z1_pro_center
mode: queued
