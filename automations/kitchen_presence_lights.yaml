---
id: kitchen_presence_lights
alias: 'Kitchen: presence lights'
description: 'Presence: Cabinet LED, Walkway, Main Light on. No presence: Walkway
  + Main Light off, Cabinet LED off 10 s later. Mode restart: presence returning during
  the 10 s cancels the Cabinet LED off. Never touches the Washing Machine.'
triggers:
- trigger: state
  entity_id: binary_sensor.kitchen_presence_sensor_presence
  from: 'off'
  to: 'on'
  id: present
- trigger: state
  entity_id: binary_sensor.kitchen_presence_sensor_presence
  from: 'on'
  to: 'off'
  id: clear
conditions: []
actions:
- choose:
  - conditions:
    - condition: trigger
      id: present
    sequence:
    - action: switch.turn_on
      target:
        entity_id:
        - switch.kitchen_switch_1_top
        - switch.kitchen_switch_1_center
        - switch.kitchen_switch_2_right
  - conditions:
    - condition: trigger
      id: clear
    sequence:
    - action: switch.turn_off
      target:
        entity_id:
        - switch.kitchen_switch_1_center
        - switch.kitchen_switch_2_right
    - delay:
        seconds: 10
    - action: switch.turn_off
      target:
        entity_id: switch.kitchen_switch_1_top
mode: restart
