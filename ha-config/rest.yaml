# NG Shuttle bus arrivals (issue #3). The API has no CORS headers, so HA polls it and the dashboard reads the sensor.
- resource: https://ngshuttle-cyas5qjv.manus.space/api/v1/bus-arrival?BusStopCode=NG
  scan_interval: 60
  timeout: 15
  sensor:
    - name: "NG Shuttle arrivals"
      unique_id: ng_shuttle_bus_arrivals
      icon: mdi:bus-clock
      device_class: timestamp
      # State = next bus ETA of the first service. Full response kept in attributes.
      value_template: >-
        {% set s = value_json.Services | default([]) %}
        {{ s[0].NextBus.EstimatedArrival if s and s[0].NextBus.EstimatedArrival else None }}
      json_attributes:
        - BusStopCode
        - Services
